stages:
  - test
  - quality
  - postcode

# The image must contain git: the analysis job builds a diff between the merge
# request target branch and HEAD. python3/pytest/pyyaml run the unit tests and
# validate this file and the Duo flow config.
default:
  image: alpine:3.20
  before_script:
    - apk add --no-cache git python3 py3-pytest py3-yaml
  interruptible: true

unit-tests:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 -m pytest tests -q

# Repository quality gates: licence, documentation, secrets, honest claims,
# accessibility and responsive layout. The same script runs locally, so a green
# pipeline and a green laptop mean the same thing.
quality-gates:
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 ci/quality_gates.py .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - quality-gates.json
    reports:
      codequality: codequality.json

postcode-sentinel:
  stage: postcode
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # Full history so `git diff origin/<target>...HEAD` can find a merge base.
    GIT_DEPTH: "0"
  script:
    - |
      set -eu
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
        TARGET="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git fetch --no-tags origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
        RANGE="origin/$TARGET...HEAD"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] \
        && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
        && git cat-file -e "$CI_COMMIT_BEFORE_SHA^{commit}" 2>/dev/null; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        RANGE="HEAD~1..HEAD"
      fi
      echo "diff range: $RANGE"
      if ! git diff --no-ext-diff "$RANGE" > merged.diff 2>/dev/null; then
        echo "range $RANGE unavailable, falling back to HEAD~1..HEAD"
        git diff --no-ext-diff HEAD~1..HEAD > merged.diff
      fi
      echo "diff bytes: $(wc -c < merged.diff)"
    - python3 -m sentinel review merged.diff --offline --dry-run --format md > sentinel-report.md
    - python3 -m sentinel analyze merged.diff --offline --format json > sentinel-report.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - merged.diff
      - sentinel-report.md
      - sentinel-report.json
