stages:
  - test
  - postcode

# Deterministic, token-free analysis of the merged diff on every MR and on the
# default branch. No GitLab API calls are made here: review runs in dry-run.

postcode-sentinel:
  stage: postcode
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - python3 -m pip install --no-cache-dir pytest
  script:
    - |
      set -eu
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch --no-tags origin "$TARGET" || true
      if git rev-parse --verify "origin/$TARGET" >/dev/null 2>&1; then
        git diff "origin/$TARGET...HEAD" > merged.diff
      else
        git diff HEAD~1 > merged.diff
      fi
      echo "diff bytes: $(wc -c < merged.diff)"
    - python3 -m pytest tests -q
    - python3 -m sentinel review merged.diff --dry-run --format md | tee sentinel-report.md
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - merged.diff
      - sentinel-report.md
  allow_failure: false
